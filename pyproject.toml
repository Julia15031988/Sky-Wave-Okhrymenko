[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-wave-okhrymenko"
version = "0.1.0"
description = "Research on nonlinear trajectory prediction using Kalman Filters and LSTM neural networks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Yuliia Okhrymenko" }
]
keywords = [
    "trajectory-prediction",
    "kalman-filter",
    "lstm",
    "deep-learning",
    "scientific-research",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.14,<2",
    "torch>=2.5,<3",
    "filterpy>=1.4.5,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.5,<2",
    "PyYAML>=6,<7",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "data",
    "models/checkpoints",
    "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
